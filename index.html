<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LC - Your Daily Tech Insight</title>
  <meta name="description" content="A modern and visually appealing web application for sharing and discovering the latest news, articles, and insights in the world of technology." />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Thêm thanh cuộn tùy chỉnh cho giao diện tinh tế hơn */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0c0a09; /* Giữ nguyên màu nền của track */
    }
    ::-webkit-scrollbar-thumb {
      background: #581c87; /* Màu tím đậm, phù hợp với màu nhấn của trang web */
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #7e22ce; /* Màu tím sáng hơn khi di chuột qua */
    }
    body {
        background-color: #0c0a09;
    }
  </style>

    }
  }
